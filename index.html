<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="theme-color" content="#ffffff">
  <title>mdlingo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css?v=20261112-authors">
  <script src="app.js?v=20261112-authors" defer></script>
</head>
<body>
  <header class="app-nav">
    <nav aria-label="Main">
      <a href="#/">Home</a>
      <a href="#/quiz">Quiz</a>
      <a href="#/about">About</a>
    </nav>
    <button id="theme" type="button" aria-pressed="false" aria-label="Switch to dark mode"
      title="Switch to dark mode">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12 3a9 9 0 0 0 0 18Z" fill="currentColor"/>
      </svg>
    </button>
  </header>
  <p class="review-banner" role="note">This website is under review.</p>
  <main>
    <h1 id="page-heading" tabindex="-1">mdlingo</h1>
    <p class="intro">Find a phrase. Show it to your patient.</p>
    <div class="search-tools">
      <div id="language-home"></div>
      <div id="language-control">
        <label class="language-label" for="language">Patient language</label>
        <div class="language-combo">
          <input id="language" role="combobox" aria-autocomplete="list" aria-expanded="false"
            aria-controls="language-options" autocomplete="off" spellcheck="false">
          <ul id="language-options" role="listbox" aria-label="Patient languages" hidden></ul>
        </div>
      </div>
      <form id="search-form" role="search">
        <label class="search-label" for="search">Find a question or instruction</label>
        <input id="search" type="search" placeholder="Search English or patient language…" autocomplete="off">
      </form>
    </div>
    <a id="back" class="button-link" href="#/quiz" hidden>← Quiz setup</a>
    <p id="count" role="status" aria-live="polite">Loading phrases…</p>
    <div id="results"></div>
  </main>
  <footer>
    <p>Karanvir Gill · Arvin Zaker <a class="button-link small" href="#/sources">Sources</a></p>
    <p>Use a professional interpreter for history, consent and results.</p>
  </footer>
  <dialog id="fullscreen" aria-labelledby="large-translation">
    <div class="dialog-tools">
      <span>Show your patient</span>
      <button id="smaller" aria-label="Decrease text size">A−</button>
      <button id="larger" aria-label="Increase text size">A+</button>
      <button id="close">Close ✕</button>
    </div>
    <div class="large-body">
      <p id="large-english"></p>
      <p id="large-translation"></p>
      <p id="large-transliteration"></p>
      <p id="large-context" class="context"></p>
      <div class="tags">
        <span id="large-status" class="badge reviewed"></span>
        <span id="large-source"></span>
      </div>
    </div>
  </dialog>
</body>
</html>
